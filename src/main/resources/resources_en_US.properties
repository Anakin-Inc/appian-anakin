## Must have [class].name and [class].description for all connected system and integration templates
AnakinConnectedSystemTemplate.name=Anakin
AnakinConnectedSystemTemplate.description=Web scraping, AI search, and agentic research via the Anakin API (anakin.io).

AnakinUrlScraperIntegrationTemplate.name=Anakin - Scrape URL
AnakinUrlScraperIntegrationTemplate.description=Scrape a single URL to Markdown/HTML/JSON. Submits to POST /url-scraper, polls GET /url-scraper/:jobId until done.

AnakinSearchIntegrationTemplate.name=Anakin - AI Search
AnakinSearchIntegrationTemplate.description=AI-powered web search. Synchronous -- POST /search, no polling. Costs 3 credits per call.

AnakinAgenticSearchIntegrationTemplate.name=Anakin - Agentic Search
AnakinAgenticSearchIntegrationTemplate.description=Multi-stage AI research pipeline with optional structured output. Submits to POST /agentic-search, polls GET /agentic-search/:jobId until done. Costs 10 credits.
