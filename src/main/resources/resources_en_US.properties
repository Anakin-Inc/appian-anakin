## Must have [class].name and [class].description for all connected system and integration templates
AnakinConnectedSystemTemplate.name=Anakin
AnakinConnectedSystemTemplate.description=Web scraping, AI search, and agentic research via the Anakin API (anakin.io).

AnakinUrlScraperIntegrationTemplate.name=Anakin - Scrape URL
AnakinUrlScraperIntegrationTemplate.description=Scrape a single URL to Markdown/HTML/JSON. Submits to POST /url-scraper, polls GET /url-scraper/:jobId until done.

AnakinSearchIntegrationTemplate.name=Anakin - AI Search
AnakinSearchIntegrationTemplate.description=AI-powered web search. Synchronous -- POST /search, no polling. Costs 3 credits per call.

AnakinAgenticSearchIntegrationTemplate.name=Anakin - Agentic Search
AnakinAgenticSearchIntegrationTemplate.description=Multi-stage AI research pipeline with optional structured output. Submits to POST /agentic-search, polls GET /agentic-search/:jobId until done. Costs 10 credits.

AnakinMapIntegrationTemplate.name=Anakin - Map Site
AnakinMapIntegrationTemplate.description=Discover all reachable URLs under a site. Submits to POST /map, polls GET /map/:jobId until done.

AnakinCrawlIntegrationTemplate.name=Anakin - Crawl Site
AnakinCrawlIntegrationTemplate.description=Bulk-fetch markdown/HTML across a site. Submits to POST /crawl, polls GET /crawl/:jobId until done.

AnakinWireDiscoverIntegrationTemplate.name=Anakin - Wire Discover
AnakinWireDiscoverIntegrationTemplate.description=Find Wire actions for a task from a natural-language intent. GET /wire/resolve.

AnakinWireCatalogIntegrationTemplate.name=Anakin - Wire Catalog
AnakinWireCatalogIntegrationTemplate.description=Browse the Wire catalog: every supported site, or one site's full action list. GET /wire/catalog[/:slug].

AnakinWireReadActionIntegrationTemplate.name=Anakin - Wire Read Action
AnakinWireReadActionIntegrationTemplate.description=Run a Wire action that extracts data (read-only). Submits to POST /wire/task, polls GET /wire/jobs/:jobId when async.

AnakinWireWriteActionIntegrationTemplate.name=Anakin - Wire Write Action
AnakinWireWriteActionIntegrationTemplate.description=Run a Wire action that changes state on the target site (form submit, cart add, etc). Submits to POST /wire/task, polls GET /wire/jobs/:jobId when async.

AnakinWireIdentitiesIntegrationTemplate.name=Anakin - Wire Identities
AnakinWireIdentitiesIntegrationTemplate.description=List saved Wire identities and credentials. GET /wire/identities.

AnakinWireLoginIntegrationTemplate.name=Anakin - Wire Login
AnakinWireLoginIntegrationTemplate.description=Sign in to a credentials-mode Wire site and get a credential_id. POST /wire/login.

AnakinWireBuildIntegrationTemplate.name=Anakin - Wire Build
AnakinWireBuildIntegrationTemplate.description=Request a brand-new Wire action for a site not yet in the catalog. POST /wire/build-request. Charges credits.

AnakinMonitorCreateIntegrationTemplate.name=Anakin - Create Monitor
AnakinMonitorCreateIntegrationTemplate.description=Create a scheduled website monitor that alerts on content changes. POST /monitors.

AnakinMonitorListIntegrationTemplate.name=Anakin - List Monitors
AnakinMonitorListIntegrationTemplate.description=List website monitors, or fetch one by ID. GET /monitors[/:id].

AnakinMonitorChangesIntegrationTemplate.name=Anakin - Monitor Changes
AnakinMonitorChangesIntegrationTemplate.description=Get the detected changes for a monitor. GET /monitors/:id/changes.

AnakinMonitorControlIntegrationTemplate.name=Anakin - Control Monitor
AnakinMonitorControlIntegrationTemplate.description=Pause, resume, run-now, or delete a website monitor. POST/DELETE /monitors/:id[/pause|resume|run].

AnakinAiVisibilitySearchIntegrationTemplate.name=Anakin - AI Visibility Search
AnakinAiVisibilitySearchIntegrationTemplate.description=Ask multiple AI answer engines the same question and compare answers. Submits to POST /ai-visibility/search, polls GET /ai-visibility/search/:searchId until done.

AnakinAiVisibilitySourcesIntegrationTemplate.name=Anakin - AI Visibility Sources
AnakinAiVisibilitySourcesIntegrationTemplate.description=List the AI answer engines available to AI Visibility Search. GET /ai-visibility/sources.

AnakinSessionListIntegrationTemplate.name=Anakin - List Sessions
AnakinSessionListIntegrationTemplate.description=List saved browser sessions (encrypted login states). GET /sessions.

AnakinSessionDeleteIntegrationTemplate.name=Anakin - Delete Session
AnakinSessionDeleteIntegrationTemplate.description=Permanently delete a saved browser session. DELETE /sessions/:id.

AnakinBrowserTaskIntegrationTemplate.name=Anakin - Browser Task
AnakinBrowserTaskIntegrationTemplate.description=Run a natural-language task in a real AI-driven cloud browser. Submits to POST /ai/evaluate (async), polls GET /ai/jobs/:workflowId until done.
